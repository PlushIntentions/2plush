<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plush Intentions – Tech Portal</title>
  <link rel="stylesheet" href="tech.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  

  <!-- APP SHELL -->
  <div id="app-shell" class="hidden">

    <!-- TOPBAR -->
    <header class="topbar glass-bar">
      <div class="topbar-left">
        <span id="tech-name">Technician</span>
        <span class="status-pill" id="tech-status">Offline</span>
      </div>
      <div class="topbar-right">
        <button id="clock-btn" class="btn-glass">Clock In</button>
      </div>
    </header>

    <!-- MAIN -->
    <main class="main-content">

      <!-- HOME -->
      <section class="panel active" id="panel-home">
        <div class="glass-grid">
          <div class="glass-card">
            <h2>Today</h2>
            <p id="home-summary">Loading…</p>
          </div>
          <div class="glass-card">
            <h3>Current Job</h3>
            <div id="current-job">No active job</div>
          </div>
        </div>
      </section>

      <!-- ASSIGNED JOBS -->
      <section class="panel" id="panel-jobs">
        <h2>My Jobs</h2>
        <div id="jobs-list" class="glass-list"></div>
      </section>

      <!-- UNASSIGNED -->
      <section class="panel" id="panel-unassigned">
        <h2>Unassigned Work Orders</h2>
        <div id="unassigned-list" class="glass-list"></div>
      </section>

      <!-- JOB DETAIL -->
      <section class="panel" id="panel-job-detail">
        <button class="btn-link" id="back-to-jobs">&larr; Back</button>
        <div class="glass-card" id="job-detail-card"></div>
      </section>

      <!-- EARNINGS -->
      <section class="panel" id="panel-earnings">
        <h2>Earnings & Hours</h2>
        <div class="glass-grid">
          <div class="glass-card">
            <h3>Total Earnings</h3>
            <div id="earn-total">$0.00</div>
          </div>
          <div class="glass-card">
            <h3>Total Hours</h3>
            <div id="earn-hours">0h 0m</div>
          </div>
          <div class="glass-card">
            <h3>Completed Jobs</h3>
            <div id="earn-count">0</div>
          </div>
        </div>
        <div class="glass-card">
          <h3>Per Job</h3>
          <div id="earnings-list" class="glass-list"></div>
        </div>
      </section>

      <!-- INFRACTIONS -->
      <section class="panel" id="panel-infractions">
        <h2>Infractions</h2>
        <div id="infractions-list" class="glass-list"></div>
      </section>

      <!-- PROFILE -->
      <section class="panel" id="panel-profile">
        <h2>Profile</h2>
        <div class="glass-card">
          <p id="profile-email"></p>
          <button id="signout-btn" class="btn-glass">Sign Out</button>
        </div>
      </section>

    </main>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav glass-bar">
      <button data-target="home" class="nav-btn active">Home</button>
      <button data-target="jobs" class="nav-btn">Jobs</button>
      <button data-target="unassigned" class="nav-btn">Unassigned</button>
      <button data-target="earnings" class="nav-btn">Earnings</button>
      <button data-target="profile" class="nav-btn">Profile</button>
    </nav>

  </div>


  <!-- SIMPLE TOAST -->
  <div id="toast"></div>

  <script src="tech.js"></script>
  <!-- SIGNATURE MODAL -->
  <div id="signature-modal" class="modal hidden">
    <div class="modal-content glass-card">
      <h3>Manager on Duty Signature</h3>
      <canvas id="signature-pad"></canvas>
      <div class="modal-actions">
        <button id="sig-clear">Clear</button>
        <button id="sig-save">Save</button>
        <button id="sig-cancel">Cancel</button>
      </div>
    </div>
  </div>


  
</body>
</html>
