<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Technician Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      background: #0b0e14;
      color: #fff;
      font-family: system-ui, sans-serif;
    }

    nav {
      display: flex;
      justify-content: space-around;
      background: #111827;
      padding: 12px;
      border-bottom: 1px solid #1f2937;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    nav button {
      background: none;
      border: none;
      color: #9ca3af;
      font-size: 1rem;
      padding: 8px 12px;
      cursor: pointer;
    }

    nav button.active {
      color: #3b82f6;
      border-bottom: 2px solid #3b82f6;
    }

    .page {
      display: none;
      padding: 16px;
    }

    .page.active {
      display: block;
    }

    .job-card {
      background: #1f2937;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .earnings-box {
      background: #1f2937;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .earnings-value {
      font-size: 2rem;
      font-weight: bold;
      color: #3b82f6;
    }

    #mapbox {
      width: 100%;
      height: 70vh;
      border-radius: 12px;
      margin-top: 12px;
    }
  </style>
</head>

<body>

  <nav>
    <button onclick="showPage('dashboard')" id="nav-dashboard" class="active">Dashboard</button>
    <button onclick="showPage('assigned')" id="nav-assigned">Assigned</button>
    <button onclick="showPage('available')" id="nav-available">Available</button>
    <button onclick="showPage('earnings')" id="nav-earnings">Earnings</button>
    <button onclick="showPage('map')" id="nav-map">Map</button>
  </nav>

  <!-- DASHBOARD HOME -->
  <div id="dashboard" class="page active">
    <h2>Welcome Technician</h2>
    <p>Your live job updates will appear here.</p>
  </div>

  <!-- ASSIGNED JOBS -->
  <div id="assigned" class="page">
    <h2>Assigned Jobs</h2>
    <div id="assignedJobs"></div>
  </div>

  <!-- AVAILABLE JOBS -->
  <div id="available" class="page">
    <h2>Available Jobs</h2>
    <div id="unassignedJobs"></div>
  </div>

  <!-- EARNINGS PAGE -->
  <div id="earnings" class="page">
    <h2>Your Earnings</h2>

    <div class="earnings-box">
      <p>Today</p>
      <div class="earnings-value" id="earningsToday">$0.00</div>
    </div>

    <div class="earnings-box">
      <p>This Week</p>
      <div class="earnings-value" id="earningsWeek">$0.00</div>
    </div>

    <div class="earnings-box">
      <p>This Month</p>
      <div class="earnings-value" id="earningsMonth">$0.00</div>
    </div>
  </div>

  <!-- MAP PAGE -->
  <div id="map" class="page">
    <h2>Technician Map</h2>
    <div id="mapbox"></div>
  </div>

  <!-- LIBRARIES -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></

  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
script>
 <script src=/tech-dashboard.js"></script>
  <!-- CLEAN FINAL DASHBOARD JS -->
  <script>
    // ============================
    // SUPABASE CLIENT + GLOBALS
    // ============================
   
    let mapLoaded = false;

    // ============================
    // PAGE NAVIGATION
    // ============================
    function showPage(page) {
      document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
      document.getElementById(page).classList.add("active");

      document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
      document.getElementById("nav-" + page).classList.add("active");

      if (page === "map") loadMap();
      if (page === "earnings") loadEarnings();
    }

    // ============================
    // BOOT APP
    // ============================
    async function bootApp() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return alert("Not logged in");

      TECH_ID = user.id;

      loadAssignedJobs();
      loadUnassignedJobs();
      subscribeToJobChanges();
    }

    // ============================
    // LOAD ASSIGNED JOBS
    // ============================
    async function loadAssignedJobs() {
      const { data } = await supabase
        .from("jobs")
        .select("*")
        .eq("assigned_to", TECH_ID);

      const container = document.getElementById("assignedJobs");
      container.innerHTML = "";

      data?.forEach(job => {
        container.innerHTML += `
          <div class="job-card">
            <h3>${job.title}</h3>
            <p>${job.description}</p>
            <button onclick="checkIn(${job.id})">Check In</button>
            <button onclick="completeJob(${job.id})">Complete</button>
          </div>
        `;
      });
    }

    // ============================
    // LOAD AVAILABLE JOBS
    // ============================
    async function loadUnassignedJobs() {
      const { data } = await supabase
        .from("jobs")
        .select("*")
        .is("assigned_to", null);

      const container = document.getElementById("unassignedJobs");
      container.innerHTML = "";

      data?.forEach(job => {
        container.innerHTML += `
          <div class="job-card">
            <h3>${job.title}</h3>
            <p>${job.description}</p>
            <button onclick="acceptJob(${job.id})">Accept</button>
            <button onclick="declineJob(${job.id})">Decline</button>
          </div>
        `;
      });
    }

    // ============================
    // ACCEPT JOB
    // ============================
    async function acceptJob(jobId) {
      await supabase.from("jobs").update({
        assigned_to: TECH_ID,
        status: "accepted"
      }).eq("id", jobId);

      await supabase.from("job_requests").insert({
        job_id: jobId,
        technician_id: TECH_ID
      });

      loadAssignedJobs();
      loadUnassignedJobs();
    }

    // ============================
    // DECLINE JOB
    // ============================
    async function declineJob(jobId) {
      await supabase.from("job_declines").insert({
        job_id: jobId,
        technician_id: TECH_ID
      });

      loadUnassignedJobs();
    }

    // ============================
    // CHECK-IN / COMPLETE
    // ============================
    async function checkIn(jobId) {
      await supabase.from("jobs").update({
        status: "in_progress",
        check_in_time: new Date().toISOString()
      }).eq("id", jobId);

      loadAssignedJobs();
    }

    async function completeJob(jobId) {
      await supabase.from("jobs").update({
        status: "completed",
        completed_time: new Date().toISOString()
      }).eq("id", jobId);

      loadAssignedJobs();
    }

    // ============================
    // REAL-TIME JOB UPDATES
    // ============================
    function subscribeToJobChanges() {
      supabase
        .channel("jobs")
        .on("postgres_changes", { event: "*", schema: "public", table: "jobs" }, () => {
          loadAssignedJobs();
          loadUnassignedJobs();
        })
        .subscribe();
    }

    // ============================
    // EARNINGS CALCULATION
    // ============================
    async function loadEarnings() {
      const { data } = await supabase
        .from("jobs")
        .select("price, completed_time")
        .eq("assigned_to", TECH_ID)
        .eq("status", "completed");

      let today = 0, week = 0, month = 0;
      const now = new Date();

      data?.forEach(job => {
        const completed = new Date(job.completed_time);
        if (!job.price) return;

        if (completed.toDateString() === now.toDateString()) today += job.price;
        if (completed >= new Date(now - 7 * 86400000)) week += job.price;
        if (completed.getMonth() === now.getMonth()) month += job.price;
      });

      document.getElementById("earningsToday").innerText = `$${today.toFixed(2)}`;
      document.getElementById("earningsWeek").innerText = `$${week.toFixed(2)}`;
      document.getElementById("earningsMonth").innerText = `$${month.toFixed(2)}`;
    }

    // ============================
    // MAPBOX MAP
    // ============================
    function loadMap() {
      if (mapLoaded) return;

      mapboxgl.accessToken = "pk.eyJ1IjoicGx1c2gtaW50ZW50aW9ucyIsImEiOiJjbXA5ejJlcGwwMzQxMnJwdXBpZTg5NmYxIn0.i0wFsO5_bt70k942AsMNcg";

      const map = new mapboxgl.Map({
        container: "mapbox",
        style: "mapbox://styles/mapbox/dark-v11",
        center: [-82.18, 41.45],
        zoom: 10
      });

      mapLoaded = true;
    }

    // ============================
    // START APP
    // ============================
    bootApp();
  </script>

</body>
</html>
